services:
  validator:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./docs/build/html:/app/docs_html:ro
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
